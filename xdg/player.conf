# player.conf

# Window size or screen resolution (in full-screen mode). Specified as
# <width>x<height>.
# size = 1920x1080

# Window position. Specified as <x>,<y>. May not work on all desktops.
# pos = 0,0

# Frame rate. Specified as a fraction <num>/<denom>
# (e.g., 60000/1001, 50000/1000).
# rate = 60000/1000

# Audio cadence. Specified as a repeating sequence of N
# sample counts whose sum equals 48000 × N ÷ frame rate.
# For common frame rates, the default cadence is:
#   23.976fps > 2002
#   24fps     > 2000
#   25fps     > 1920
#   29.97fps  > 1602,1601,1602,1601,1602
#   30fps     > 1600
#   50fps     >  960
#   59.94fps  >  801,801,800,801,801
#   60fps     >  800
# For others, it must be specified manually.
# cadence = 800

# Switch to full-screen mode. May not work on all desktops.
# full-screen

# Display window with border. If neither --full-screen nor --border is
# specified, a borderless window is. displayed.
# border

# Position window on top of others.
# topmost

# Display length for images in milliseconds.
# image-len = 10000

# Transition. Specified as <type>,<len>[,tween][,dir].
# Type is one of: cut, mix, push, slide, wipe, fadecut, cutfade, or vfade.
# Length is transition length in milliseconds.
# Tween is one of:   linear
#   easeinquad       easeoutquad       easeinoutquad       easeoutinquad
#   easeincubic      easeoutcubic      easeinoutcubic      easeoutincubic
#   easeinquart      easeoutquart      easeinoutquart      easeoutinquart
#   easeinquint      easeoutquint      easeinoutquint      easeoutinquint
#   easeinsine       easeoutsine       easeinoutsine       easeoutinsine
#   easeinexpo       easeoutexpo       easeinoutexpo       easeoutinexpo
#   easeincirc       easeoutcirc       easeinoutcirc       easeoutincirc
#   easeinelastic    easeoutelastic    easeinoutelastic    easeoutinelastic
#   easeinback       easeoutback       easeinoutback       easeoutinback
#   easeinbounce     easeoutbounce     easeinoutbounce     easeoutinbounce
# And, direction - which only applies to push, slide, and wipe - is one of:
# left (or fromright), right (or fromleft), up (or fromdown), or down
# (fromtop).
tran = mix,500

# Image stretch mode. Must be one of: original, stretch, fit, fill, hfill, or
# vfill.
# mode = stretch
